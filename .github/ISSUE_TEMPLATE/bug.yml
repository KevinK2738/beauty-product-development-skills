name: Skill behavior issue
description: Report an incorrect trigger, output, or boundary
title: "[Skill] "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill name
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and minimum reproducible input
      description: Remove confidential or personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected professional behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform, version, and model
    validations:
      required: true

